<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f19;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 95%;
            max-width: 1000px;
            height: 90vh;
            background: #111827;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        header {
            padding: 20px;
            background: #151d2e;
            border-bottom: 1px solid #263147;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        header p {
            margin: 5px 0 0;
            color: #9ca3af;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .message {
            margin-bottom: 18px;
            padding: 14px 18px;
            border-radius: 15px;
            max-width: 80%;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            margin-left: auto;
            background: #2563eb;
        }

        .nova {
            margin-right: auto;
            background: #1f2937;
        }

        .input-area {
            display: flex;
            padding: 15px;
            background: #151d2e;
            gap: 10px;
        }

        #message {
            flex: 1;
            padding: 15px;
            border: none;
            outline: none;
            border-radius: 12px;
            background: #0f172a;
            color: white;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 0 22px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        @media(max-width: 600px) {
            .app {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <h1>✦ NOVA</h1>
        <p>Tu asistente de inteligencia artificial</p>
    </header>

    <div id="chat">

        <div class="message nova">
            Hola. Soy NOVA. 🚀
            ¿En qué puedo ayudarte?
        </div>

    </div>

    <div class="input-area">

        <input
            id="message"
            type="text"
            placeholder="Escribe algo..."
            autocomplete="off"
        >

        <button onclick="sendMessage()">
            Enviar
        </button>

    </div>

</div>

<script>

const input = document.getElementById("message");
const chat = document.getElementById("chat");

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

}

function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";

    setTimeout(() => {

        addMessage(
            "Todavía estoy conectando mi cerebro de IA. En el siguiente paso conectaremos NOVA con Gemini.",
            "nova"
        );

    }, 500);

}

</script>

</body>
</html>
